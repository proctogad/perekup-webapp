name: Cron Notifications

on:
  schedule:
    # Каждые 5 минут
    - cron: '*/5 * * * *'
  # Можно запустить вручную
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron endpoint
        run: |
          curl -X POST https://neon-reseller.neon-reseller-worker.workers.dev/cron \
            -H "x-telegram-bot-api-secret-token: 45edaf936c7b2810"
